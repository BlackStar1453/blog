[extra.donation]
# 打赏功能配置
enable = true                               # 是否启用打赏功能
show_in_posts = true                        # 是否在文章末尾显示
show_in_sidebar = true                      # 是否在侧边栏显示
show_floating_button = true                 # 是否显示浮动按钮

# 支付方式开关
enable_alipay = false                       # 是否启用支付宝（已禁用）
enable_wechat = true                        # 是否启用微信支付
enable_stripe = true                        # 是否启用Stripe支付
use_static_qr = false                       # 是否使用静态二维码（false=使用动态二维码）

# 静态二维码配置（仅在 use_static_qr = true 时使用）
alipay_qr = "images/alipay-qr.svg"         # 支付宝二维码路径（相对于static目录）
wechat_qr = "images/wechat-qr.jpg"         # 微信二维码路径（静态收款码，用户扫码后手动输入金额）

# Stripe Payment Links（美元 USD）
# 请在 Stripe Dashboard 创建对应的 Payment Links 并填入实际链接
stripe_link_5 = "https://buy.stripe.com/bJe28r54vgoTaEz7dg5J608"       # $5 USD
stripe_link_10 = "https://buy.stripe.com/fZu7sL0Of4Gb7sn4145J603"      # $10 USD
stripe_link_custom = "https://buy.stripe.com/bJe6oH2Wn6OjdQL8hk5J605"  # 自定义金额

# 微信支付动态二维码 API（通过 Cloudflare Workers）
wechat_api_endpoint = "/api/donation/wechat-qr"  # Workers API 端点

# 金额配置（人民币）
amounts = [10, 25]                          # 预设金额选项（人民币 ¥）
custom_amount_enabled = true                # 是否启用自定义金额
min_amount = 10                             # 最低金额（人民币 ¥）
usd_to_cny_rate = 7.2                       # 美元到人民币汇率

# 文字配置
title_zh = "支持我的创作"                   # 中文标题
title_en = "Support My Work"                # 英文标题
message_zh = "如果您觉得我的内容对您有帮助，欢迎请我喝杯咖啡 ☕"
message_en = "If you find my content helpful, consider buying me a coffee ☕"

[extra.special_dates]
# 特殊日期配置 - 在特定日期显示横幅并收集往年同日内容
[[extra.special_dates.dates]]
month = 9
day = 20
title = "生日！生日快乐！"
message = "你可以在这个页面找到所有你生日那天发布的文章"
banner_color = "#4a90e2"
text_color = "#ffffff"

[extra.waline]
# Waline评论系统配置
enable = true                           # 是否启用Waline评论系统
server_url = "https://walline-eight.vercel.app"          # Waline服务器地址，部署完成后填入（例如：https://your-waline.vercel.app）
dark = "auto"                           # 暗黑模式（auto=自动，true=强制暗黑，false=强制明亮）
meta = ["nick", "mail"]                 # 评论者信息（nick=昵称，mail=邮箱，link=网址）
required_meta = ["nick"]                # 必填字段（仅昵称必填，实现匿名评论）
login = "disable"                       # 登录方式（disable=禁用登录，enable=启用社交登录，force=强制登录）
word_limit = 0                          # 评论字数限制（0=不限制）
page_size = 10                          # 每页评论数
avatar = "mp"                           # 头像样式（mp/identicon/monsterid/wavatar/retro/robohash/hide）
avatar_cdn = "https://sdn.geekzu.org/avatar/" # 头像CDN（使用国内可访问的镜像）
lang = "zh-CN"                          # 界面语言（zh-CN/en/jp等）
locale_mapping = true                   # 是否根据页面语言自动切换（true=自动，false=固定）
highlight = true                        # 代码高亮
math_tag_support = true                 # 数学公式支持
emoji = ["//unpkg.com/@waline/emojis@1.2.0/weibo"]  # 表情包CDN
search = false                          # 搜索功能（需要服务端配置）
reaction = true                         # 文章反应（点赞等）

